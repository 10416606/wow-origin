name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'Anomi-oo/wow-origin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Merge upstream without discarding local changes
        env:
          DESTINATION_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_URL: https://github.com/Anomi-oo/wow-origin.git
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_URL" main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit --no-ff FETCH_HEAD; then
            echo "Upstream changes conflict with local customizations. Resolve them in a pull request; the deployed branch was not changed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm ci
          npm run build
          npm run cloudflare:typecheck
          npm test -- --runInBand --silent
          git push origin "HEAD:$DESTINATION_BRANCH"
          echo "Merged Anomi-oo/wow-origin main while preserving local changes." >> "$GITHUB_STEP_SUMMARY"
